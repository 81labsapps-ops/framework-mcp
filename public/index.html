<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>framework-mcp</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 640px;
    margin: 3rem auto;
    padding: 0 1.25rem;
    line-height: 1.5;
  }
  h1 { font-size: 1.4rem; }
  p.tagline { color: #666; margin-top: -0.5rem; }
  .card {
    border: 1px solid #ccc4;
    border-radius: 10px;
    padding: 1.25rem;
    margin-top: 1.5rem;
  }
  input[type="email"] {
    width: 100%;
    box-sizing: border-box;
    padding: 0.6rem 0.7rem;
    font-size: 1rem;
    border-radius: 6px;
    border: 1px solid #999;
    margin-bottom: 0.75rem;
  }
  button {
    padding: 0.6rem 1.1rem;
    font-size: 1rem;
    border-radius: 6px;
    border: none;
    background: #5b4bda;
    color: white;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  pre {
    background: #0002;
    padding: 0.9rem;
    border-radius: 8px;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-all;
    font-size: 0.85rem;
  }
  .error { color: #c0392b; margin-top: 0.5rem; }
  .warn { color: #b8860b; font-size: 0.9rem; }
  .copy-btn { margin-top: 0.5rem; background: #444; }
</style>
</head>
<body>
  <h1>framework-mcp</h1>
  <p class="tagline">Verified, version-pinned Expo SDK docs for coding agents, over remote MCP.</p>

  <div class="card">
    <label for="email"><strong>Get an API key</strong></label>
    <input type="email" id="email" placeholder="you@example.com" required />
    <button id="submit">Generate my API key</button>
    <div id="error" class="error"></div>
  </div>

  <div class="card" id="result" style="display:none">
    <p class="warn">Save this key now - it will not be shown again.</p>
    <pre id="rawKey"></pre>
    <p>Add this to your MCP client config (e.g. Claude Code's <code>.mcp.json</code>):</p>
    <pre id="snippet"></pre>
    <button class="copy-btn" id="copy">Copy config</button>
  </div>

<script>
  const emailInput = document.getElementById("email");
  const submitBtn = document.getElementById("submit");
  const errorDiv = document.getElementById("error");
  const resultDiv = document.getElementById("result");
  const rawKeyPre = document.getElementById("rawKey");
  const snippetPre = document.getElementById("snippet");
  const copyBtn = document.getElementById("copy");

  let lastSnippet = "";

  submitBtn.addEventListener("click", async () => {
    errorDiv.textContent = "";
    const email = emailInput.value.trim();
    if (!email) {
      errorDiv.textContent = "Enter an email address.";
      return;
    }
    submitBtn.disabled = true;
    try {
      const res = await fetch("/signup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email }),
      });
      const data = await res.json();
      if (!res.ok) {
        errorDiv.textContent = data.error || "Something went wrong.";
        return;
      }
      rawKeyPre.textContent = data.apiKey;
      lastSnippet = JSON.stringify(
        {
          mcpServers: {
            "framework-mcp": {
              type: "http",
              url: window.location.origin + "/mcp",
              headers: { Authorization: "Bearer " + data.apiKey },
            },
          },
        },
        null,
        2
      );
      snippetPre.textContent = lastSnippet;
      resultDiv.style.display = "block";
    } catch {
      errorDiv.textContent = "Network error - try again.";
    } finally {
      submitBtn.disabled = false;
    }
  });

  copyBtn.addEventListener("click", async () => {
    await navigator.clipboard.writeText(lastSnippet);
    copyBtn.textContent = "Copied!";
    setTimeout(() => (copyBtn.textContent = "Copy config"), 1500);
  });
</script>
</body>
</html>
